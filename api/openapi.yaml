        bendingTimes: { type: integer, minimum: 0, default: 0, description: "刀数" }
        remark: { type: string, maxLength: 300 }

    BatchItem:
      allOf:
        - $ref: "#/components/schemas/BatchItemInput"
        - type: object
          required: [id, batchId, seq, drawingNo, pattern, thickness, color, length, width, pieceArea, sprayingArea, packageQty, weldLine, bendingTimes, remark]
          properties:
            id: { type: integer, format: int64 }
