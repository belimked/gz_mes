        packing: { type: string, maxLength: 50 }
        receiver: { type: string, maxLength: 50 }
        receiverPhone: { type: string, maxLength: 50 }
        receiverAddress: { type: string, maxLength: 300 }
        remark: { type: string, maxLength: 500 }

    ContractPage:
      type: object
