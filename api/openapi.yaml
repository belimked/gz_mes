    ScanPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Scan" }
        total: { type: integer, format: int64 }

    LabelDetail:
      allOf:
        - $ref: "#/components/schemas/Label"
        - type: object
          required: [scans]
          properties:
