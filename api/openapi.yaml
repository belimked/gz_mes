        name: { type: string, example: 钣金下线 }
        seq: { type: integer, description: "Execution order, 1-based" }
        stage:
          type: string
          enum: [sheet_metal, spray, finished]
          description: "钣金工段 / 喷涂工段 / 成品包装发货"

    BatchStatus:
      type: string
      enum: [pending, scheduled, in_production, done]
      description: "待排产 / 已排产 / 生产中 / 已完工"

    Urgency:
      type: string
      enum: [normal, urgent]

    Batch:
      type: object
      required:
        [id, factoryId, contractId, contractNo, customerId, customerName, projectId, projectName, lotNo, clientOrderNo,
         thickness, color, colorNo, texture, sprayingType, orderQty, orderArea, deliveryAddress, specialRequest,
         requiredDate, urgency, status, itemCount, itemQty, itemArea, workshop, remark, createdBy, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        factoryId: { type: integer, format: int64 }
        contractId: { type: integer, format: int64 }
        contractNo: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        projectId: { type: integer, format: int64 }
        projectName: { type: string }
        lotNo: { type: string, description: "批次号，厂区内唯一" }
        clientOrderNo: { type: string, description: "客户单号" }
        thickness: { type: number, format: double, description: "板厚 mm" }
        color: { type: string, description: "客户颜色" }
        colorNo: { type: string, description: "色号" }
        texture: { type: string, description: "材质" }
        sprayingType: { type: string, description: "喷涂类型" }
        orderQty: { type: integer }
        orderArea: { type: number, format: double }
        deliveryAddress: { type: string }
        specialRequest: { type: string }
        requiredDate: { type: string, format: date, nullable: true, description: "客户需求交期" }
        urgency: { $ref: "#/components/schemas/Urgency" }
        status: { $ref: "#/components/schemas/BatchStatus" }
        itemCount: { type: integer, description: "构件行数" }
        itemQty: { type: integer, description: "构件总件数" }
        itemArea: { type: number, format: double, description: "构件总单件面积合计 m²" }
        planTechDate: { type: string, format: date, nullable: true, description: "计划工艺日期(计划部)" }
        planDrawingDate: { type: string, format: date, nullable: true, description: "计划出图日期(技术部)" }
        planCutDate: { type: string, format: date, nullable: true, description: "计划开料日期" }
        planSheetStart: { type: string, format: date, nullable: true, description: "计划钣金开始" }
        planSheetDelivery: { type: string, format: date, nullable: true, description: "计划钣金交期" }
        planSprayStart: { type: string, format: date, nullable: true }
        planSprayDelivery: { type: string, format: date, nullable: true }
        outsourceFactoryId: { type: integer, format: int64, nullable: true, description: "计划外协钣金厂" }
        outsourceFactoryName: { type: string, nullable: true }
        workshop: { type: string, description: "计划钣金车间" }
        remark: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BatchCreate:
      type: object
      required: [contractId, lotNo]
      properties:
        contractId: { type: integer, format: int64 }
        lotNo: { type: string, minLength: 1, maxLength: 64 }
        clientOrderNo: { type: string, maxLength: 64 }
        thickness: { type: number, format: double, minimum: 0, default: 0 }
        color: { type: string, maxLength: 100 }
        colorNo: { type: string, maxLength: 50 }
        texture: { type: string, maxLength: 50 }
        sprayingType: { type: string, maxLength: 50 }
        orderQty: { type: integer, minimum: 0, default: 0 }
        orderArea: { type: number, format: double, minimum: 0, default: 0 }
        deliveryAddress: { type: string, maxLength: 300 }
        specialRequest: { type: string, maxLength: 500 }
        requiredDate: { type: string, format: date }
        urgency: { $ref: "#/components/schemas/Urgency" }
        remark: { type: string, maxLength: 500 }

    BatchSchedule:
      type: object
      description: Omitted fields are left unchanged; send null to clear a date.
      properties:
        planTechDate: { type: string, format: date, nullable: true }
        planDrawingDate: { type: string, format: date, nullable: true }
        planCutDate: { type: string, format: date, nullable: true }
        planSheetStart: { type: string, format: date, nullable: true }
        planSheetDelivery: { type: string, format: date, nullable: true }
        planSprayStart: { type: string, format: date, nullable: true }
        planSprayDelivery: { type: string, format: date, nullable: true }
        outsourceFactoryId: { type: integer, format: int64, nullable: true }
        workshop: { type: string, maxLength: 50 }
        urgency: { $ref: "#/components/schemas/Urgency" }
        remark: { type: string, maxLength: 500 }

    BatchPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Batch" }
        total: { type: integer, format: int64 }

    BatchItemInput:
      type: object
      required: [pieceNo, qty]
      properties:
        pieceNo: { type: string, minLength: 1, maxLength: 64, description: "编号 / 板号" }
        drawingNo: { type: string, maxLength: 64, description: "图号" }
        pattern: { type: string, maxLength: 100, description: "板型" }
        thickness: { type: number, format: double, minimum: 0, default: 0 }
        color: { type: string, maxLength: 100 }
        length: { type: number, format: double, minimum: 0, default: 0, description: "mm" }
        width: { type: number, format: double, minimum: 0, default: 0, description: "mm" }
        pieceArea: { type: number, format: double, minimum: 0, default: 0, description: "单件展开面积 m²" }
        sprayingArea: { type: number, format: double, minimum: 0, default: 0, description: "单件喷涂面积 m²" }
