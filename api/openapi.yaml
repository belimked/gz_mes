        contractId: { type: integer, format: int64 }
        lotNo: { type: string, minLength: 1, maxLength: 64 }
        clientOrderNo: { type: string, maxLength: 64 }
        thickness: { type: number, format: double, minimum: 0, default: 0 }
        color: { type: string, maxLength: 100 }
        colorNo: { type: string, maxLength: 50 }
        texture: { type: string, maxLength: 50 }
        sprayingType: { type: string, maxLength: 50 }
        orderQty: { type: integer, minimum: 0, default: 0 }
        orderArea: { type: number, format: double, minimum: 0, default: 0 }
        deliveryAddress: { type: string, maxLength: 300 }
        specialRequest: { type: string, maxLength: 500 }
        requiredDate: { type: string, format: date }
        urgency: { $ref: "#/components/schemas/Urgency" }
        remark: { type: string, maxLength: 500 }

    BatchSchedule:
      type: object
      description: Omitted fields are left unchanged; send null to clear a date.
      properties:
        planTechDate: { type: string, format: date, nullable: true }
        planDrawingDate: { type: string, format: date, nullable: true }
        planCutDate: { type: string, format: date, nullable: true }
        planSheetStart: { type: string, format: date, nullable: true }
        planSheetDelivery: { type: string, format: date, nullable: true }
        planSprayStart: { type: string, format: date, nullable: true }
        planSprayDelivery: { type: string, format: date, nullable: true }
        outsourceFactoryId: { type: integer, format: int64, nullable: true }
        workshop: { type: string, maxLength: 50 }
        urgency: { $ref: "#/components/schemas/Urgency" }
        remark: { type: string, maxLength: 500 }

    BatchPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Batch" }
        total: { type: integer, format: int64 }

    BatchItemInput:
      type: object
      required: [pieceNo, qty]
      properties:
        pieceNo: { type: string, minLength: 1, maxLength: 64, description: "编号 / 板号" }
        drawingNo: { type: string, maxLength: 64, description: "图号" }
        pattern: { type: string, maxLength: 100, description: "板型" }
        thickness: { type: number, format: double, minimum: 0, default: 0 }
        color: { type: string, maxLength: 100 }
        length: { type: number, format: double, minimum: 0, default: 0, description: "mm" }
        width: { type: number, format: double, minimum: 0, default: 0, description: "mm" }
        pieceArea: { type: number, format: double, minimum: 0, default: 0, description: "单件展开面积 m²" }
        sprayingArea: { type: number, format: double, minimum: 0, default: 0, description: "单件喷涂面积 m²" }
        qty: { type: integer, minimum: 1 }
        packageQty: { type: integer, minimum: 0, default: 0, description: "包装数" }
        weldLine: { type: number, format: double, minimum: 0, default: 0, description: "焊缝 m" }
        bendingTimes: { type: integer, minimum: 0, default: 0, description: "刀数" }
        remark: { type: string, maxLength: 300 }

    BatchItem:
      allOf:
        - $ref: "#/components/schemas/BatchItemInput"
        - type: object
          required: [id, batchId, seq, drawingNo, pattern, thickness, color, length, width, pieceArea, sprayingArea, packageQty, weldLine, bendingTimes, remark]
          properties:
            id: { type: integer, format: int64 }
            batchId: { type: integer, format: int64 }
            seq: { type: integer, description: "Row order as imported, 1-based" }

    Label:
      type: object
      required: [id, barCode, factoryId, batchId, lotNo, projectName, batchItemId, pieceNo, pieceIndex, qty, drawingNo, pattern, thickness, color, pieceArea, cancelled, createdAt]
      properties:
        id: { type: integer, format: int64 }
        barCode: { type: string, description: "13-digit code, unique" }
        factoryId: { type: integer, format: int64 }
        batchId: { type: integer, format: int64 }
        lotNo: { type: string }
        projectName: { type: string }
        batchItemId: { type: integer, format: int64 }
        pieceNo: { type: string }
        pieceIndex: { type: integer, description: "1-based index within the item (第几件)" }
        qty: { type: integer, description: "Item qty, for display 'n / qty'" }
        drawingNo: { type: string }
        pattern: { type: string }
        thickness: { type: number, format: double }
        color: { type: string }
        pieceArea: { type: number, format: double }
        cancelled: { type: boolean }
        lastJobId: { type: integer, format: int64, nullable: true, description: "Highest-seq job scanned" }
        lastJobName: { type: string, nullable: true }
        lastScannedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    LabelPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        total: { type: integer, format: int64 }

    LabelGenerateResult:
      type: object
      required: [created, total]
      properties:
        created: { type: integer, description: "Labels created by this call" }
        total: { type: integer, description: "Labels now existing for the batch (excluding cancelled)" }

    Scan:
      type: object
      required: [id, labelId, barCode, batchId, lotNo, pieceNo, pieceIndex, jobId, jobName, scannedBy, scannedAt, device]
      properties:
        id: { type: integer, format: int64 }
        labelId: { type: integer, format: int64 }
        barCode: { type: string }
        batchId: { type: integer, format: int64 }
        lotNo: { type: string }
        pieceNo: { type: string }
        pieceIndex: { type: integer }
        jobId: { type: integer, format: int64 }
        jobName: { type: string }
        scannedBy: { type: string }
        scannedAt: { type: string, format: date-time }
        device: { type: string }

    ScanPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Scan" }
        total: { type: integer, format: int64 }

    LabelDetail:
      allOf:
        - $ref: "#/components/schemas/Label"
        - type: object
          required: [scans]
          properties:
            scans:
              type: array
              items: { $ref: "#/components/schemas/Scan" }

    ScanRequest:
      type: object
      required: [barCode, jobCode]
      properties:
        barCode: { type: string, minLength: 1, maxLength: 64 }
        jobCode: { type: string, minLength: 1, maxLength: 16, description: "Job code, e.g. \"20\"" }
        device: { type: string, maxLength: 64 }

    JobProgress:
      type: object
      required: [jobId, jobCode, jobName, seq, scannedQty, scannedArea]
      properties:
        jobId: { type: integer, format: int64 }
        jobCode: { type: string }
        jobName: { type: string }
        seq: { type: integer }
        scannedQty: { type: integer }
        scannedArea: { type: number, format: double }

    BatchProgress:
      type: object
      required: [batchId, status, totalQty, totalArea, labelQty, jobs]
      properties:
        batchId: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/BatchStatus" }
        totalQty: { type: integer, description: "Σ item qty" }
        totalArea: { type: number, format: double }
        labelQty: { type: integer, description: "Non-cancelled labels" }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobProgress" }

    ScanResult:
      type: object
      required: [scan, label, progress]
      properties:
        scan: { $ref: "#/components/schemas/Scan" }
        label: { $ref: "#/components/schemas/Label" }
        progress: { $ref: "#/components/schemas/BatchProgress" }

    Handover:
      type: object
      required: [id, handoverNo, factoryId, batchId, lotNo, projectName, jobId, jobCode, jobName, qty, area, remark, packedBy, packedAt, received]
      properties:
        id: { type: integer, format: int64 }
        handoverNo: { type: string }
        factoryId: { type: integer, format: int64 }
        batchId: { type: integer, format: int64 }
        lotNo: { type: string }
        projectName: { type: string }
        jobId: { type: integer, format: int64 }
        jobCode: { type: string }
        jobName: { type: string }
        qty: { type: integer, description: "Label count" }
        area: { type: number, format: double, description: "Σ pieceArea" }
        remark: { type: string }
        packedBy: { type: string }
        packedAt: { type: string, format: date-time }
        received: { type: boolean }
        receivedBy: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time, nullable: true }

    HandoverDetail:
      allOf:
        - $ref: "#/components/schemas/Handover"
        - type: object
          required: [labels]
          properties:
            labels:
              type: array
              items: { $ref: "#/components/schemas/Label" }

    HandoverPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Handover" }
        total: { type: integer, format: int64 }

    HandoverCreate:
      type: object
      required: [batchId, jobCode, barCodes]
      properties:
        batchId: { type: integer, format: int64 }
        jobCode: { type: string, minLength: 1, maxLength: 16 }
        barCodes:
          type: array
          minItems: 1
          maxItems: 2000
          items: { type: string }
        remark: { type: string, maxLength: 500 }

    DeliveryNote:
      type: object
      required: [id, noteNo, factoryId, batchId, lotNo, projectName, customerId, customerName, contractNo, deliveryBatch, qty, area, logisticsCompany, plateNo, driver, driverPhone, deliveredAt, remark, accounted, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        noteNo: { type: string }
        factoryId: { type: integer, format: int64 }
        batchId: { type: integer, format: int64 }
        lotNo: { type: string }
        projectName: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        contractNo: { type: string }
        deliveryBatch: { type: string, description: "发货批次（第几车）" }
        qty: { type: integer }
        area: { type: number, format: double }
        logisticsCompany: { type: string }
        plateNo: { type: string }
        driver: { type: string }
        driverPhone: { type: string }
        deliveredAt: { type: string, format: date }
        remark: { type: string }
        accounted: { type: boolean }
        accountId: { type: integer, format: int64, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    DeliveryNoteDetail:
      allOf:
        - $ref: "#/components/schemas/DeliveryNote"
        - type: object
          required: [labels]
          properties:
            labels:
              type: array
              items: { $ref: "#/components/schemas/Label" }

    DeliveryNotePage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeliveryNote" }
        total: { type: integer, format: int64 }

    DeliveryNoteCreate:
      type: object
      required: [batchId, barCodes, deliveredAt]
      properties:
        batchId: { type: integer, format: int64 }
        barCodes:
          type: array
          minItems: 1
          maxItems: 2000
          items: { type: string }
        deliveryBatch: { type: string, maxLength: 32 }
        logisticsCompany: { type: string, maxLength: 100 }
        plateNo: { type: string, maxLength: 20 }
        driver: { type: string, maxLength: 50 }
        driverPhone: { type: string, maxLength: 20 }
        deliveredAt: { type: string, format: date }
        remark: { type: string, maxLength: 500 }

    AccountStatus:
      type: string
      enum: [draft, confirmed]

    DeliverAccount:
      type: object
      required: [id, accountNo, factoryId, customerId, customerName, noteCount, totalQty, totalArea, unitPrice, extraAmount, extraRemark, amount, status, remark, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        accountNo: { type: string }
        factoryId: { type: integer, format: int64 }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        noteCount: { type: integer }
        totalQty: { type: integer }
        totalArea: { type: number, format: double }
        unitPrice: { type: number, format: double, description: "元/m²" }
        extraAmount: { type: number, format: double, description: "运费等附加" }
        extraRemark: { type: string }
        amount: { type: number, format: double }
        status: { $ref: "#/components/schemas/AccountStatus" }
        remark: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        confirmedBy: { type: string, nullable: true }
        confirmedAt: { type: string, format: date-time, nullable: true }

    DeliverAccountDetail:
      allOf:
        - $ref: "#/components/schemas/DeliverAccount"
        - type: object
          required: [notes]
          properties:
            notes:
              type: array
              items: { $ref: "#/components/schemas/DeliveryNote" }

    DeliverAccountPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeliverAccount" }
        total: { type: integer, format: int64 }

    DeliverAccountCreate:
      type: object
      required: [customerId, deliveryNoteIds, unitPrice]
      properties:
        customerId: { type: integer, format: int64 }
        deliveryNoteIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: integer, format: int64 }
        unitPrice: { type: number, format: double, minimum: 0 }
        extraAmount: { type: number, format: double, default: 0 }
        extraRemark: { type: string, maxLength: 200 }
        remark: { type: string, maxLength: 500 }

    ValuationBasis:
      type: string
      enum: [order_area, item_area, delivered_area]
      description: "Which area the unit price applies to: 订单面积 / 构件面积 / 已发货面积"

    BatchValuation:
      type: object
      required: [batchId, lotNo, contractId, contractNo, customerId, customerName, projectName, thickness, color, orderQty, orderArea, itemArea, deliveredQty, deliveredArea, status, basis, basisArea, unitPrice, ingotPrice, amount, remark, audited, createdAt]
      properties:
        batchId: { type: integer, format: int64 }
        lotNo: { type: string }
        contractId: { type: integer, format: int64 }
        contractNo: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        projectName: { type: string }
        thickness: { type: number, format: double }
        color: { type: string }
        orderQty: { type: integer }
        orderArea: { type: number, format: double }
        itemArea: { type: number, format: double }
        deliveredQty: { type: integer, description: "Labels on delivery notes" }
        deliveredArea: { type: number, format: double }
        status: { $ref: "#/components/schemas/BatchStatus" }
        basis: { $ref: "#/components/schemas/ValuationBasis" }
        basisArea: { type: number, format: double, description: "Area the amount was computed from" }
        unitPrice: { type: number, format: double, description: "元/m²" }
        ingotPrice: { type: number, format: double, description: "下单铝锭价 元/吨，仅记录" }
        amount: { type: number, format: double }
        remark: { type: string }
        audited: { type: boolean }
        auditedBy: { type: string, nullable: true }
        auditedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time, description: "Batch creation time (下单日期)" }

    BatchValuationPage:
      type: object
      required: [items, total, totalAmount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BatchValuation" }
        total: { type: integer, format: int64 }
        totalAmount: { type: number, format: double, description: "Σ amount over the whole filter, not just the page" }

    BatchValuationInput:
      type: object
      required: [basis, unitPrice]
      properties:
        basis: { $ref: "#/components/schemas/ValuationBasis" }
        unitPrice: { type: number, format: double, minimum: 0 }
        ingotPrice: { type: number, format: double, minimum: 0, default: 0 }
        remark: { type: string, maxLength: 500 }

    Dashboard:
      type: object
      required: [generatedAt, kpi, batchStatus, jobLoad, scanTrend, customerArea, activeBatches, recentScans, recentActivity, alerts]
      properties:
        generatedAt: { type: string, format: date-time }
        kpi: { $ref: "#/components/schemas/DashboardKpi" }
        batchStatus:
          type: array
          description: Batch count per status (pie)
          items: { $ref: "#/components/schemas/StatusCount" }
        jobLoad:
          type: array
          description: Per job, pieces of in-production batches whose latest scan is this job (bar)
          items: { $ref: "#/components/schemas/JobLoad" }
        scanTrend:
          type: array
          description: One entry per day, oldest first (line)
          items: { $ref: "#/components/schemas/DailyScan" }
        customerArea:
          type: array
          description: Order area of open (not done) batches per customer, top 6 + 其他 (pie)
          items: { $ref: "#/components/schemas/CustomerArea" }
        activeBatches:
          type: array
          description: In-production batches ordered by requiredDate, max 8
          items: { $ref: "#/components/schemas/ActiveBatch" }
        recentScans:
          type: array
          description: Latest 8 scans
          items: { $ref: "#/components/schemas/Scan" }
        recentActivity:
          type: array
          description: Latest 8 scan groups — scans by the same (batch, job, scannedBy) within the same 10-minute bucket are merged
          items: { $ref: "#/components/schemas/ScanActivity" }
        alerts:
          type: array
          description: |
            Rule-based alerts, most severe first, max 20. Rules:
            overdue — open batch past requiredDate (error); due_soon — open batch due within 3 days (warning);
            stalled — pieces sitting at a job for over 24h (error when > 72h, else warning);
            unaccounted — delivery notes with no account for over 7 days (warning);
            idle — scheduled batch whose planSheetStart is past but has no scan (warning);
            no_labels — scheduled batch with items but no labels and planCutDate past (info).
          items: { $ref: "#/components/schemas/DashboardAlert" }

    DashboardAlert:
      type: object
      required: [rule, level, title, detail, link]
      properties:
        rule: { type: string, enum: [overdue, due_soon, stalled, unaccounted, idle, no_labels] }
        level: { type: string, enum: [error, warning, info] }
        title: { type: string }
        detail: { type: string }
        link: { type: string, description: "Frontend route to act on it, e.g. /scheduling/batches?keyword=PC-1" }
        batchId: { type: integer, format: int64, nullable: true }
        lotNo: { type: string, nullable: true }
        jobId: { type: integer, format: int64, nullable: true }
        count: { type: integer, nullable: true, description: "pieces / notes affected" }
        hours: { type: number, format: double, nullable: true, description: "age for stalled/unaccounted" }
        days: { type: integer, nullable: true, description: "overdue / due_soon days" }

    ScanActivity:
      type: object
      required: [batchId, lotNo, jobId, jobName, scannedBy, staffNo, qty, area, lastScannedAt]
      properties:
        batchId: { type: integer, format: int64 }
        lotNo: { type: string }
        jobId: { type: integer, format: int64 }
        jobName: { type: string }
        scannedBy: { type: string }
        staffNo: { type: string }
        qty: { type: integer }
        area: { type: number, format: double }
        lastScannedAt: { type: string, format: date-time }

    DashboardKpi:
      type: object
      required: [inProduction, pendingSchedule, doneToday, todayScanQty, todayScanArea, labelQty, deliveredQty, deliveredArea, unaccountedNotes, unaccountedArea, urgentOpen, overdueOpen]
      properties:
        inProduction: { type: integer, description: "Batches in_production" }
        pendingSchedule: { type: integer, description: "Batches pending" }
        doneToday: { type: integer, description: "Batches that became done today" }
        todayScanQty: { type: integer }
        todayScanArea: { type: number, format: double }
        labelQty: { type: integer, description: "Active labels of open batches" }
        deliveredQty: { type: integer, description: "Pieces on delivery notes in the trend window" }
        deliveredArea: { type: number, format: double }
        unaccountedNotes: { type: integer, description: "Delivery notes not yet on an account" }
        unaccountedArea: { type: number, format: double }
        urgentOpen: { type: integer, description: "Open batches flagged urgent" }
        overdueOpen: { type: integer, description: "Open batches past requiredDate" }

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: { $ref: "#/components/schemas/BatchStatus" }
        count: { type: integer }

    JobLoad:
      type: object
      required: [jobId, jobCode, jobName, seq, qty, area, cycleSamples, cycleHours, dwellHours]
      properties:
        jobId: { type: integer, format: int64 }
        jobCode: { type: string }
        jobName: { type: string }
        seq: { type: integer }
        qty: { type: integer }
        area: { type: number, format: double }
        cycleSamples: { type: integer, description: "Scans at this job in the trend window that have a previous-job scan (seq 1: label creation) to measure from" }
        cycleHours: { type: number, format: double, nullable: true, description: "Average hours from the previous job's scan (seq 1: label creation) to this job's scan, over the trend window. null when no samples" }
        cycleP90Hours: { type: number, format: double, nullable: true, description: "90th percentile of the same durations" }
        dwellHours: { type: number, format: double, nullable: true, description: "Average hours the pieces currently sitting at this step have been waiting (now - scan at this job). null when qty is 0" }
        dwellMaxHours: { type: number, format: double, nullable: true, description: "Longest wait among those pieces" }

    DailyScan:
      type: object
      required: [date, qty, area, deliveredQty, deliveredArea, activeBatches, doneBatches]
      properties:
        date: { type: string, format: date }
        qty: { type: integer, description: "Scans that day" }
        area: { type: number, format: double }
        deliveredQty: { type: integer, description: "Pieces shipped that day (delivery note deliveredAt)" }
        deliveredArea: { type: number, format: double }
        activeBatches: { type: integer, description: "Distinct batches with at least one scan that day" }
        doneBatches: { type: integer, description: "Batches that became done that day (status done, updatedAt date)" }

    CustomerArea:
      type: object
      required: [customerId, customerName, area, batches]
      properties:
        customerId: { type: integer, format: int64, nullable: true, description: "null for 其他" }
        customerName: { type: string }
        area: { type: number, format: double }
        batches: { type: integer }

    ActiveBatch:
      type: object
      required: [id, lotNo, projectName, customerName, thickness, color, itemQty, itemArea, labelQty, currentSeq, currentJobName, progress, requiredDate, urgency]
      properties:
        id: { type: integer, format: int64 }
        lotNo: { type: string }
        projectName: { type: string }
        customerName: { type: string }
        thickness: { type: number, format: double }
        itemQty: { type: integer }
        itemArea: { type: number, format: double }
        labelQty: { type: integer }
        color: { type: string }
        currentSeq: { type: integer, description: "Highest job seq with at least one scan, 0 if none" }
        currentJobName: { type: string }
        progress: { type: integer, description: "0-100: Σ(scans) / (labelQty × 11)" }
        requiredDate: { type: string, format: date, nullable: true }
        urgency: { $ref: "#/components/schemas/Urgency" }
