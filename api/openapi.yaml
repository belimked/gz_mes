openapi: 3.0.3
info:
  title: GZ MES API
  version: 0.1.0
  description: |
    Single source of truth for the backend (Go, oapi-codegen) and the frontend
    (TypeScript types via openapi-typescript, demo-mode mocks).
    Timestamps are RFC3339 strings.
servers:
  - url: /api
security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      security: []
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/login:
    post:
      operationId: login
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user and visible menus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /factories:
    get:
      operationId: listFactories
      tags: [system]
      description: Factories visible to the current user.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Factory" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createFactory
      tags: [system]
      description: Admin only (403 forbidden). 409 duplicate_code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /factories/{id}:
    put:
      operationId: updateFactory
      tags: [system]
      description: Admin only. Rename or stop/resume a factory; code and kind are immutable.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Factory" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /menus:
    get:
      operationId: listMenus
      tags: [system]
      description: Full menu tree (flat), admin only. Used to assign menus to users.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuItem" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /users:
    get:
      operationId: listUsers
      tags: [system]
      description: Admin only.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: keyword, in: query, schema: { type: string }, description: "Matches username / displayName" }
        - { name: enabled, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      tags: [system]
      description: |
        Admin only. Creates the account, grants the listed factories and the listed menus (a per-user role
        "user:<username>" is created). Non-admin users need at least one factory (400). 409 duplicate_code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /users/{id}:
    get:
      operationId: getUser
      tags: [system]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateUser
      tags: [system]
      description: |
        Admin only. Replaces displayName / enabled / isAdmin / factoryIds / menuIds (lists are replace-all).
        Cannot disable yourself or drop your own admin flag (409 self_lock).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /users/{id}/password:
    put:
      operationId: resetUserPassword
      tags: [system]
      description: Admin only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordReset" }
      responses:
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /projects:
    get:
      operationId: listProjects
      tags: [sale]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPage" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createProject
      tags: [sale]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /projects/{id}/confirm:
    post:
      operationId: confirmProject
      tags: [sale]
      description: Confirming locks the project against further edits.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /customers:
    get:
      operationId: listCustomers
      tags: [sale]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: keyword, in: query, schema: { type: string }, description: "Matches name / easCode / easName" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPage" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createCustomer
      tags: [sale]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /customers/{id}/confirm:
    post:
      operationId: confirmCustomer
      tags: [sale]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /contracts:
    get:
      operationId: listContracts
      tags: [sale]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: keyword, in: query, schema: { type: string }, description: "Matches contractNo / customerContractNo / innerContractNo / customer name / project name / salesman" }
        - { name: customerId, in: query, schema: { type: integer, format: int64 } }
        - { name: projectId, in: query, schema: { type: integer, format: int64 } }
        - { name: beginDate, in: query, schema: { type: string, format: date }, description: "createdAt >= beginDate (inclusive)" }
        - { name: endDate, in: query, schema: { type: string, format: date }, description: "createdAt < endDate + 1 day" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createContract
      tags: [sale]
      description: customerId and projectId must belong to the same factory as the contract.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /contracts/{id}:
    get:
      operationId: getContract
      tags: [sale]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /contracts/{id}/audit-valuation:
    post:
      operationId: auditContractValuation
      tags: [sale]
      description: Marks the customer or outsource valuation as audited. Idempotent conflict (409) if already audited.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValuationAudit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /jobs:
    get:
      operationId: listJobs
      tags: [production]
      description: Process steps (工序) in execution order.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Error" }

  /batches:
    get:
      operationId: listBatches
      tags: [scheduling]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: keyword, in: query, schema: { type: string }, description: "Matches lotNo / clientOrderNo / contractNo / customerName / projectName" }
        - { name: contractId, in: query, schema: { type: integer, format: int64 } }
        - { name: projectId, in: query, schema: { type: integer, format: int64 } }
        - { name: customerId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/BatchStatus" } }
        - { name: urgency, in: query, schema: { $ref: "#/components/schemas/Urgency" } }
        - { name: beginDate, in: query, schema: { type: string, format: date }, description: "requiredDate >= beginDate" }
        - { name: endDate, in: query, schema: { type: string, format: date }, description: "requiredDate <= endDate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createBatch
      tags: [scheduling]
      description: The batch inherits factoryId, customer and project from its contract.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /batches/{id}:
    get:
      operationId: getBatch
      tags: [scheduling]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /batches/{id}/schedule:
    put:
      operationId: scheduleBatch
      tags: [scheduling]
      description: |
        Sets or updates planning fields. Status moves pending → scheduled when planSheetStart is set.
        Not allowed once the batch is done (409). outsourceFactoryId must be an outsource factory.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchSchedule" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Batch" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /batches/{id}/items:
    get:
      operationId: listBatchItems
      tags: [scheduling]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BatchItem" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: replaceBatchItems
      tags: [scheduling]
      description: |
        Replaces the whole component list (import semantics). pieceNo must be unique within the batch.
        Recomputes itemQty / itemArea on the batch. Not allowed once the batch is done (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 5000
              items: { $ref: "#/components/schemas/BatchItemInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BatchItem" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /batches/{id}/labels/generate:
    post:
      operationId: generateLabels
      tags: [production]
      description: |
        Creates one label per piece (batch item × qty) that does not have one yet. Idempotent: re-running
        after items were appended only creates the missing labels. Requires at least one item (400).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelGenerateResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /batches/{id}/progress:
    get:
      operationId: getBatchProgress
      tags: [production]
      description: Scanned piece counts per job for one batch.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchProgress" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /labels:
    get:
      operationId: listLabels
      tags: [production]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: batchId, in: query, schema: { type: integer, format: int64 } }
        - { name: keyword, in: query, schema: { type: string }, description: "Matches barCode / pieceNo / lotNo / projectName" }
        - { name: cancelled, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /labels/{barCode}:
    get:
      operationId: getLabel
      tags: [production]
      description: Label with its scan history, for the handheld screen.
      parameters:
        - { name: barCode, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /labels/{barCode}/cancel:
    post:
      operationId: cancelLabel
      tags: [production]
      description: Voids a label (e.g. misprint). Not allowed once it has scans (409).
      parameters:
        - { name: barCode, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /scans:
    get:
      operationId: listScans
      tags: [production]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: batchId, in: query, schema: { type: integer, format: int64 } }
        - { name: jobId, in: query, schema: { type: integer, format: int64 } }
        - { name: beginDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: scanLabel
      tags: [production]
      description: |
        Records that a piece passed a job (扫码报工). Rules: label must exist in scope and not be cancelled;
        the same label is counted once per job (409 already_scanned); jobs must be scanned in seq order —
        the previous job must already be scanned unless this is seq 1 (409 out_of_order). The first scan
        moves the batch to in_production; when every label has passed the last job the batch becomes done.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /handovers:
    get:
      operationId: listHandovers
      tags: [production]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: batchId, in: query, schema: { type: integer, format: int64 } }
        - { name: jobId, in: query, schema: { type: integer, format: int64 } }
        - { name: received, in: query, schema: { type: boolean } }
        - { name: keyword, in: query, schema: { type: string }, description: "Matches handoverNo / lotNo / projectName" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoverPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createHandover
      tags: [production]
      description: |
        Packs labels that have passed the given job into a handover sheet (交接单). Every barcode must belong
        to the batch, be active, have a scan at that job, and not already sit on another handover for the
        same job (409 label_in_handover). Handover numbers are generated (JJ + yyyyMMdd + 4-digit seq).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandoverCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoverDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /handovers/{id}:
    get:
      operationId: getHandover
      tags: [production]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoverDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /handovers/{id}/receive:
    post:
      operationId: receiveHandover
      tags: [production]
      description: Marks the sheet as received by the next station. 409 already_received.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Handover" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /delivery-notes:
    get:
      operationId: listDeliveryNotes
      tags: [delivery]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: batchId, in: query, schema: { type: integer, format: int64 } }
        - { name: customerId, in: query, schema: { type: integer, format: int64 } }
        - { name: keyword, in: query, schema: { type: string }, description: "Matches noteNo / lotNo / projectName / plateNo" }
        - { name: accounted, in: query, schema: { type: boolean }, description: "Already on a deliver account" }
        - { name: beginDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryNotePage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDeliveryNote
      tags: [delivery]
      description: |
        Ships labels. Each barcode must belong to the batch, be active, have passed 成品装架 (job 55) and not be
        on another note (409 label_delivered). Creating the note records a 发货对账 (job 60) scan for every
        label, so a batch whose labels are all shipped becomes done. Note numbers: FH + yyyyMMdd + 4-digit seq.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryNoteCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryNoteDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /delivery-notes/{id}:
    get:
      operationId: getDeliveryNote
      tags: [delivery]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryNoteDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /deliver-accounts:
    get:
      operationId: listDeliverAccounts
      tags: [finance]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: customerId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AccountStatus" } }
        - { name: keyword, in: query, schema: { type: string }, description: "Matches accountNo / customerName" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverAccountPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDeliverAccount
      tags: [finance]
      description: |
        Builds a customer statement (发货对账单) from delivery notes. All notes must belong to the customer
        and not be on another account (409 note_accounted). amount = round(totalArea × unitPrice + extraAmount, 2).
        Account numbers: DZ + yyyyMMdd + 4-digit seq. Created in draft.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverAccountCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverAccountDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /deliver-accounts/{id}:
    get:
      operationId: getDeliverAccount
      tags: [finance]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverAccountDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /deliver-accounts/{id}/confirm:
    post:
      operationId: confirmDeliverAccount
      tags: [finance]
      description: draft → confirmed. 409 already_confirmed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverAccount" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /batch-valuations:
    get:
      operationId: listBatchValuations
      tags: [finance]
      description: |
        One row per batch with its valuation (工程批次对账). Rows without a valuation yet come back with
        unitPrice 0 / amount 0 / audited false. Pricing is deliberately simple for now: amount =
        round(basisArea × unitPrice, 2) where basisArea is the batch's order area, component area or shipped
        area depending on basis. (Spec open point: ingot-price adjustments and the 2× pricing area.)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: keyword, in: query, schema: { type: string }, description: "Matches lotNo / contractNo / projectName / customerName" }
        - { name: contractId, in: query, schema: { type: integer, format: int64 } }
        - { name: customerId, in: query, schema: { type: integer, format: int64 } }
        - { name: audited, in: query, schema: { type: boolean } }
        - { name: beginDate, in: query, schema: { type: string, format: date }, description: "Batch createdAt range" }
        - { name: endDate, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchValuationPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /batches/{id}/valuation:
    put:
      operationId: setBatchValuation
      tags: [finance]
      description: Creates or replaces the batch valuation. 409 already_audited once audited.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchValuationInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchValuation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /batches/{id}/valuation/audit:
    post:
      operationId: auditBatchValuation
      tags: [finance]
      description: Locks the valuation. 404 if the batch has no valuation yet; 409 already_audited.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchValuation" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /dashboard:
    get:
      operationId: getDashboard
      tags: [report]
      description: |
        Home-page summary, scoped to the caller's factories. Counters are computed live from batches,
        labels, scan_record and delivery_note; trend covers the last 14 days (today inclusive).
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 7, maximum: 90, default: 14 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: invalid_credentials }
        message: { type: string }

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, example: ok }
        version: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, username, displayName, isAdmin, staffNo]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        staffNo: { type: string, description: "工号，可为空" }
        isAdmin: { type: boolean }

    MenuItem:
      type: object
      required: [id, title, path]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        path: { type: string, description: "Frontend route path, e.g. /sale/projects" }
        icon: { type: string }
        children:
          type: array
          items: { $ref: "#/components/schemas/MenuItem" }

    MeResponse:
      type: object
      required: [user, menus]
      properties:
        user: { $ref: "#/components/schemas/User" }
        menus:
          type: array
          items: { $ref: "#/components/schemas/MenuItem" }

    FactoryKind:
      type: string
      enum: [own, outsource]

    Factory:
      type: object
      required: [id, code, name, kind, isStop]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/FactoryKind" }
        isStop: { type: boolean }

    FactoryCreate:
      type: object
      required: [code, name, kind]
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: "#/components/schemas/FactoryKind" }

    FactoryUpdate:
      type: object
      required: [name, isStop]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        isStop: { type: boolean }

    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [enabled, factoryIds, menuIds, createdAt]
          properties:
            enabled: { type: boolean }
            factoryIds:
              type: array
              items: { type: integer, format: int64 }
            menuIds:
              type: array
              items: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }

    UserPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UserDetail" }
        total: { type: integer, format: int64 }

    UserCreate:
      type: object
      required: [username, displayName, password]
      properties:
        username: { type: string, minLength: 2, maxLength: 32, pattern: "^[a-zA-Z0-9_.-]+$" }
        displayName: { type: string, minLength: 1, maxLength: 50 }
        staffNo: { type: string, maxLength: 20, default: "" }
        password: { type: string, minLength: 6, maxLength: 72 }
        isAdmin: { type: boolean, default: false }
        factoryIds:
          type: array
          items: { type: integer, format: int64 }
        menuIds:
          type: array
          items: { type: integer, format: int64 }

    UserUpdate:
      type: object
      required: [displayName, enabled, isAdmin, factoryIds, menuIds]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        staffNo: { type: string, maxLength: 20, default: "" }
        enabled: { type: boolean }
        isAdmin: { type: boolean }
        factoryIds:
          type: array
          items: { type: integer, format: int64 }
        menuIds:
          type: array
          items: { type: integer, format: int64 }

    PasswordReset:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 6, maxLength: 72 }

    ProjectKind:
      type: string
      enum: [online, offline]

    Project:
      type: object
      required: [id, factoryId, code, fullName, shortName, address, kind, confirmed, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        factoryId: { type: integer, format: int64 }
        code: { type: string }
        fullName: { type: string }
        shortName: { type: string }
        address: { type: string }
        kind: { $ref: "#/components/schemas/ProjectKind" }
        confirmed: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    ProjectCreate:
      type: object
      required: [factoryId, code, fullName]
      properties:
        factoryId: { type: integer, format: int64 }
        code: { type: string, minLength: 1, maxLength: 64 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        shortName: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 300 }
        kind: { $ref: "#/components/schemas/ProjectKind" }

    ProjectPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        total: { type: integer, format: int64 }

    Customer:
      type: object
      required: [id, factoryId, name, contacts, phone, address, bank, account, easCode, easName, isInternal, confirmed, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        factoryId: { type: integer, format: int64 }
        name: { type: string }
        contacts: { type: string }
        phone: { type: string }
        address: { type: string }
        bank: { type: string }
        account: { type: string }
        easCode: { type: string, description: "EAS 客户编码" }
        easName: { type: string, description: "EAS 客户名称" }
        isInternal: { type: boolean, description: "内部客户" }
        confirmed: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    CustomerCreate:
      type: object
      required: [factoryId, name]
      properties:
        factoryId: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        contacts: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 50 }
        address: { type: string, maxLength: 300 }
        bank: { type: string, maxLength: 200 }
        account: { type: string, maxLength: 100 }
        easCode: { type: string, maxLength: 64 }
        easName: { type: string, maxLength: 200 }
        isInternal: { type: boolean, default: false }

    CustomerPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        total: { type: integer, format: int64 }

    Contract:
      type: object
      required:
        [id, factoryId, contractNo, customerContractNo, innerContractNo, customerId, customerName, projectId, projectName,
         salesman, orderQty, orderArea, pricingManner, payment, paymentPoint, texture, paintType, packing,
         receiver, receiverPhone, receiverAddress, remark, customerValuationAudited, outsourceValuationAudited,
         createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        factoryId: { type: integer, format: int64 }
        contractNo: { type: string, description: "合同单号，厂区内唯一" }
        customerContractNo: { type: string }
        innerContractNo: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        projectId: { type: integer, format: int64 }
        projectName: { type: string, description: "项目全称" }
        salesman: { type: string, description: "业务员" }
        orderQty: { type: integer, description: "订单数量（件）" }
        orderArea: { type: number, format: double, description: "订单面积 m²" }
        pricingManner: { type: string, description: "计价方式" }
        payment: { type: string, description: "付款方式" }
        paymentPoint: { type: string, description: "付款节点" }
        texture: { type: string, description: "材质" }
        paintType: { type: string, description: "喷涂类型" }
        packing: { type: string, description: "包装" }
        receiver: { type: string }
        receiverPhone: { type: string }
        receiverAddress: { type: string }
        remark: { type: string }
        customerValuationAudited: { type: boolean, description: "客户计价审核" }
        outsourceValuationAudited: { type: boolean, description: "外协计价审核" }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    ContractCreate:
      type: object
      required: [factoryId, contractNo, customerId, projectId]
      properties:
        factoryId: { type: integer, format: int64 }
        contractNo: { type: string, minLength: 1, maxLength: 64 }
        customerContractNo: { type: string, maxLength: 64 }
        innerContractNo: { type: string, maxLength: 64 }
        customerId: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        salesman: { type: string, maxLength: 50 }
        orderQty: { type: integer, minimum: 0, default: 0 }
        orderArea: { type: number, format: double, minimum: 0, default: 0 }
        pricingManner: { type: string, maxLength: 50 }
        payment: { type: string, maxLength: 100 }
        paymentPoint: { type: string, maxLength: 100 }
        texture: { type: string, maxLength: 50 }
        paintType: { type: string, maxLength: 50 }
        packing: { type: string, maxLength: 50 }
        receiver: { type: string, maxLength: 50 }
        receiverPhone: { type: string, maxLength: 50 }
        receiverAddress: { type: string, maxLength: 300 }
        remark: { type: string, maxLength: 500 }

    ContractPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Contract" }
        total: { type: integer, format: int64 }

    ValuationAudit:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [customer, outsource]

    Job:
      type: object
      required: [id, code, name, seq, stage]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: "20" }
        name: { type: string, example: 钣金下线 }
        seq: { type: integer, description: "Execution order, 1-based" }
        stage:
          type: string
          enum: [sheet_metal, spray, finished]
          description: "钣金工段 / 喷涂工段 / 成品包装发货"

    BatchStatus:
      type: string
      enum: [pending, scheduled, in_production, done]
      description: "待排产 / 已排产 / 生产中 / 已完工"

    Urgency:
      type: string
      enum: [normal, urgent]

    Batch:
      type: object
      required:
        [id, factoryId, contractId, contractNo, customerId, customerName, projectId, projectName, lotNo, clientOrderNo,
         thickness, color, colorNo, texture, sprayingType, orderQty, orderArea, deliveryAddress, specialRequest,
         requiredDate, urgency, status, itemCount, itemQty, itemArea, workshop, remark, createdBy, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        factoryId: { type: integer, format: int64 }
        contractId: { type: integer, format: int64 }
        contractNo: { type: string }
        customerId: { type: integer, format: int64 }
        customerName: { type: string }
        projectId: { type: integer, format: int64 }
        projectName: { type: string }
        lotNo: { type: string, description: "批次号，厂区内唯一" }
        clientOrderNo: { type: string, description: "客户单号" }
        thickness: { type: number, format: double, description: "板厚 mm" }
        color: { type: string, description: "客户颜色" }
        colorNo: { type: string, description: "色号" }
        texture: { type: string, description: "材质" }
        sprayingType: { type: string, description: "喷涂类型" }
        orderQty: { type: integer }
        orderArea: { type: number, format: double }
        deliveryAddress: { type: string }
        specialRequest: { type: string }
        requiredDate: { type: string, format: date, nullable: true, description: "客户需求交期" }
        urgency: { $ref: "#/components/schemas/Urgency" }
        status: { $ref: "#/components/schemas/BatchStatus" }
        itemCount: { type: integer, description: "构件行数" }
        itemQty: { type: integer, description: "构件总件数" }
        itemArea: { type: number, format: double, description: "构件总单件面积合计 m²" }
        planTechDate: { type: string, format: date, nullable: true, description: "计划工艺日期(计划部)" }
        planDrawingDate: { type: string, format: date, nullable: true, description: "计划出图日期(技术部)" }
        planCutDate: { type: string, format: date, nullable: true, description: "计划开料日期" }
        planSheetStart: { type: string, format: date, nullable: true, description: "计划钣金开始" }
        planSheetDelivery: { type: string, format: date, nullable: true, description: "计划钣金交期" }
        planSprayStart: { type: string, format: date, nullable: true }
        planSprayDelivery: { type: string, format: date, nullable: true }
        outsourceFactoryId: { type: integer, format: int64, nullable: true, description: "计划外协钣金厂" }
        outsourceFactoryName: { type: string, nullable: true }
        workshop: { type: string, description: "计划钣金车间" }
        remark: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BatchCreate:
      type: object
      required: [contractId, lotNo]
