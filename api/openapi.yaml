        barCode: { type: string }
        batchId: { type: integer, format: int64 }
        lotNo: { type: string }
        pieceNo: { type: string }
        pieceIndex: { type: integer }
        jobId: { type: integer, format: int64 }
        jobName: { type: string }
        scannedBy: { type: string }
