# Local / server deployment. Images default to GHCR; "make up" builds them locally instead.
name: gz-mes

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mes}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${API_IMAGE:-ghcr.io/belimked/gz-mes-api:latest}
    build:
      context: ../backend
      args:
        VERSION: ${VERSION:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mes}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mes}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      HTTP_ADDR: ":8080"

  web:
    image: ${WEB_IMAGE:-ghcr.io/belimked/gz-mes-web:latest}
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-18080}:80"

volumes:
  db-data:
