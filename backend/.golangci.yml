version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # unchecked errors are covered by errcheck
  exclusions:
    presets:
      - comments
      - std-error-handling
    paths:
      - internal/api/api.gen.go
formatters:
  enable:
    - gofmt
    - goimports
