name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gz-mes-api
            context: backend
          - name: gz-mes-web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  github-release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pin image tags in the compose file
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -e "s#gz-mes-api:latest#gz-mes-api:${v}#; s#gz-mes-web:latest#gz-mes-web:${v}#" deploy/docker-compose.yml > docker-compose.yml
          cp deploy/.env.example .env.example
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            .env.example
