name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-contract:
    name: OpenAPI codegen is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: make gen
      - name: Fail if generated code differs from committed code
        run: git diff --exit-code -- backend/internal/api frontend/src/api/schema.d.ts

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mes
          POSTGRES_PASSWORD: mes
          POSTGRES_DB: mes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mes" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall
          working-directory: backend
      - name: Test (integration, real PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://mes:mes@localhost:5432/mes?sslmode=disable
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: CGO_ENABLED=0 go build -o bin/server ./cmd/server

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:demo

  e2e-demo:
    name: E2E (demo build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-demo
          path: frontend/playwright-report
          retention-days: 7

  e2e-stack:
    name: E2E (docker compose stack)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-db-password
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password
      API_IMAGE: gz-mes-api:ci
      WEB_IMAGE: gz-mes-web:ci
      VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build images and start stack
        working-directory: deploy
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health check through nginx
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:18080/api/health
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: frontend
      - name: Playwright against the real stack
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
          E2E_USER: admin
          E2E_PASSWORD: ci-admin-password
        run: npx playwright test
      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-stack
          path: frontend/playwright-report
          retention-days: 7
