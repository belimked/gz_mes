name: Demo (Cloudflare Pages)

# main  -> https://gzmes.saulxj.ggff.net (also https://gz-mes-demo.pages.dev)
# PRs   -> per-branch preview URL (same-repo PRs only; forks get no secrets)
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip when Cloudflare secrets are not configured
        if: env.HAS_CF != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; demo deploy skipped"
      - uses: actions/checkout@v7
        if: env.HAS_CF == 'true'
      - uses: actions/setup-node@v7
        if: env.HAS_CF == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: env.HAS_CF == 'true'
        working-directory: frontend
      - run: npm run build:demo
        if: env.HAS_CF == 'true'
        working-directory: frontend
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy frontend/dist --project-name=gz-mes-demo
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
            --commit-hash=${{ github.sha }}
      - name: Comment preview URL on PR
        if: env.HAS_CF == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- gz-mes-demo -->'
            const body = `${marker}\n演示预览：${process.env.URL}\n\n账号 admin / admin123（数据为虚构，仅保存在浏览器）`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const old = comments.find((c) => c.body?.includes(marker))
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })
